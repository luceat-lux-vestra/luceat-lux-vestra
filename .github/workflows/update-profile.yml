name: Update profile content

on:
  workflow_dispatch:
  repository_dispatch:
    types: [blog-publication]
  schedule:
    - cron: "17 * * * *" # hourly fallback/self-heal; publication dispatch is the primary trigger
  pull_request:
    paths:
      - "README.md"
      - ".github/workflows/update-profile.yml"
      - "scripts/update_selected_work.py"
      - "tests/test_update_selected_work.py"
      - "tests/test_update_profile_workflow.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/update_profile.py"
      - "scripts/update_selected_work.py"
      - "scripts/render_github_overview.py"
      - "tests/test_update_selected_work.py"
      - "tests/test_update_profile_workflow.py"

permissions:
  contents: read

concurrency:
  group: update-profile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run profile updater tests
        run: python -m unittest discover -s tests -v

      - name: Verify selected work resolves to current repositories
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: luceat-lux-vestra
          STRICT_UPSTREAM: "1"
        run: |
          python scripts/update_selected_work.py
          git diff --exit-code -- README.md

  update:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for the trusted final profile-assets push below.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refresh dynamic profile content
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: luceat-lux-vestra
          BLOG_FEED: https://blog.ox0.uk/rss/
        run: |
          python scripts/update_selected_work.py
          python scripts/update_profile.py
          python scripts/render_github_overview.py

      - name: Commit generated profile content
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "Profile content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore: refresh profile activity"
          git push
