name: Update profile content

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # 12:17 KST
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-profile.yml"
      - "scripts/update_profile.py"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # Required only for the trusted final profile-assets push below.

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Refresh dynamic profile content
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: luceat-lux-vestra
          BLOG_FEED: https://blog.ox0.uk/rss/
        run: python scripts/update_profile.py

      - name: Commit generated profile content
        run: |
          if [ -z "$(git status --porcelain -- README.md assets)" ]; then
            echo "Profile content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore: refresh profile activity"
          git push
